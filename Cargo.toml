[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
mscent-math = { path = "crates/mscent-math" }
mscent-world = { path = "crates/mscent-world" }
mscent-collide = { path = "crates/mscent-collide" }
mscent-render = { path = "crates/mscent-render" }
mscent-game = { path = "crates/mscent-game" }
mscent-platform = { path = "crates/mscent-platform" }

[workspace.lints.rust]
# Crates that genuinely need unsafe must opt out explicitly with a reason.
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Tests render frames and fuzz collision in software; unoptimized they take
# minutes. Optimize the hot crates but keep debug assertions and overflow
# checks, which the hostile-input tests rely on.
[profile.dev.package.mscent-math]
opt-level = 2
[profile.dev.package.mscent-world]
opt-level = 2
[profile.dev.package.mscent-collide]
opt-level = 2
[profile.dev.package.mscent-render]
opt-level = 2
[profile.dev.package.mscent-game]
opt-level = 2

# Release builds optimize for size (the game has a binary size budget,
# tools/check_size.py), except the renderer and the vector math under it, whose
# hot paths set the frame time. Panics still unwind: Instant Play catches a
# panic in the scene, so `panic = "abort"` is not an option.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
[profile.release.package.mscent-render]
opt-level = 3
[profile.release.package.mscent-math]
opt-level = 3
