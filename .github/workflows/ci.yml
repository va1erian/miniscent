name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain and components.
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks
      - run: cargo test --workspace
      - run: python3 tools/check_file_length.py
      - run: python3 tools/check_docs.py
