name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain and components.
      - run: rustup show
      # Reuses compiled dependencies and workspace crates between runs.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks
      # The parity test needs a GPU, and runners have none: Mesa's CPU Vulkan driver.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo test --workspace --exclude mscent-gpu
        env:
          MSCENT_REQUIRE_GPU: "1" # no adapter is a failure here, a skip elsewhere
      # One test at a time: llvmpipe ended these binaries with a segfault while
      # their tests each opened a device in parallel, a different binary each run.
      - run: cargo test -p mscent-gpu -- --test-threads=1
        env:
          MSCENT_REQUIRE_GPU: "1"
      - run: python3 tools/check_file_length.py
      - run: python3 tools/check_docs.py
      - run: python3 tools/check_frame_cost.py

  # Windows, because that is the binary the budget was measured on.
  size:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: python tools/check_size.py
