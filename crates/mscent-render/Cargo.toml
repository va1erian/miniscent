[package]
name = "mscent-render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mscent-math.workspace = true
mscent-world.workspace = true

# Not `workspace = true`: this crate alone needs unsafe (std::arch SIMD in
# simd.rs). The workspace rules are repeated, with unsafe_code downgraded from
# forbid to deny so that one module can allow it explicitly.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
