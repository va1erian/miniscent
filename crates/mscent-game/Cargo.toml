[package]
name = "mscent-game"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mscent-math.workspace = true
mscent-world.workspace = true
mscent-collide.workspace = true
mscent-render.workspace = true
mscent-script.workspace = true

# Not `workspace = true`: the allocation test (tests/fx_alloc.rs) needs an
# `unsafe impl GlobalAlloc`. The library itself stays unsafe-free through
# `#![forbid(unsafe_code)]` in src/lib.rs.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
