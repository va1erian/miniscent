[package]
name = "mscent-platform"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Window, keyboard, mouse and presentation through winit and softbuffer.
desktop = ["dep:winit", "dep:softbuffer"]

[dependencies]
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

# The one FFI call in layout.rs (MapVirtualKeyW) needs unsafe; everything
# else in the crate stays under the workspace's clippy rules.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
