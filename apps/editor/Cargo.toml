[package]
name = "mscent-editor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "mscent-editor"
path = "src/main.rs"

[dependencies]
mscent-math.workspace = true
mscent-world.workspace = true
mscent-render.workspace = true
mscent-gpu.workspace = true
mscent-texgen.workspace = true
mscent-game.workspace = true
mscent-script.workspace = true
mscent-platform = { workspace = true }
# Its desktop feature for the GPU window Play presents into, as the game does.
miniscent-game = { path = "../game", default-features = false, features = ["desktop", "hardware"] }
xui = { git = "https://github.com/va1erian/xui", rev = "5754ebd6fc3bea27add2b48e203a3a82aa66c4b1", default-features = false }
xui-code-editor = { git = "https://github.com/va1erian/xui", rev = "5754ebd6fc3bea27add2b48e203a3a82aa66c4b1" }
# The guide and the manual are Markdown in one view each: a pile of text widgets cost the window a
# re-flow (docs/scripting.md). xui-markdown over xui-blitz, a whole web engine (Stylo, Taffy) for
# five kinds of block; it selects and copies, and colours examples with the script lexer.
xui-markdown = { git = "https://github.com/va1erian/xui", rev = "5754ebd6fc3bea27add2b48e203a3a82aa66c4b1" }

[target.'cfg(windows)'.dependencies]
xui-d2d = { git = "https://github.com/va1erian/xui", rev = "5754ebd6fc3bea27add2b48e203a3a82aa66c4b1", optional = true }

[features]
# Both backends: Direct2D draws the window on Windows (`--canvas` for the
# software one), and the headless selftest harness always needs canvas. Elsewhere
# d2d builds nothing and canvas draws the window.
default = ["canvas", "d2d"]
# The software backend (winit + tiny-skia) and the headless selftest harness.
canvas = ["xui/canvas"]
# The lightweight Windows backend: Direct2D and DirectWrite, native file dialogs.
# It feels faster than canvas: it repaints only what changed and draws on the GPU.
d2d = ["dep:xui-d2d"]

[dev-dependencies]
# A stand-in window for the render thread's surface tests; already in the tree
# through wgpu, winit and xui.
raw-window-handle = "0.6"

[lints]
workspace = true
