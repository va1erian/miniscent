[package]
name = "mscent-editor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "mscent-editor"
path = "src/main.rs"

[dependencies]
mscent-math.workspace = true
mscent-world.workspace = true
mscent-render.workspace = true
mscent-gpu.workspace = true
mscent-texgen.workspace = true
mscent-game.workspace = true
mscent-script.workspace = true
mscent-platform = { workspace = true }
# Its desktop feature for the GPU window Play presents into, as the game does.
miniscent-game = { path = "../game", default-features = false, features = ["desktop", "hardware"] }
xui = { git = "https://github.com/va1erian/xui", rev = "07cdfa3c00e2528ac2410a02f3baeacf51857dc7" }
xui-code-editor = { git = "https://github.com/va1erian/xui", rev = "07cdfa3c00e2528ac2410a02f3baeacf51857dc7" }
# The guide is an HTML page: it replaces a pile of text widgets (docs/scripting.md). Blitz over
# xui-litehtml, which measures text at 96 dpi and paints it at the display's, so words drift when scaled.
xui-blitz = { git = "https://github.com/va1erian/xui", rev = "07cdfa3c00e2528ac2410a02f3baeacf51857dc7" }

[dev-dependencies]
# A stand-in window for the render thread's surface tests; already in the tree
# through wgpu, winit and xui.
raw-window-handle = "0.6"

[lints]
workspace = true
